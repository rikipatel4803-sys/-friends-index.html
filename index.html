<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎉 Happy New Year 🎉</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&family=Pacifico&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  height:100vh;
  background: radial-gradient(circle at top, #1a0033, #000);
  font-family:'Poppins',sans-serif;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

/* stars */
.stars span{
  position:absolute;
  width:2px;height:2px;
  background:white;
  animation:move linear infinite;
}
@keyframes move{
  from{transform:translateY(-100vh)}
  to{transform:translateY(100vh)}
}

/* card */
.card{
  position:relative;
  padding:40px 25px;
  border-radius:25px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(20px);
  box-shadow:0 0 40px rgba(255,0,255,.6);
  text-align:center;
  max-width:340px;
  z-index:5;
}

h1{
  font-family:'Pacifico',cursive;
  font-size:42px;
  color:#ffddff;
  text-shadow:0 0 20px #ff00ff;
}

.year{
  font-size:60px;
  font-weight:800;
  color:#00ffe7;
  text-shadow:0 0 25px #00ffe7;
}

p{
  margin:15px 0;
  font-size:15px;
  opacity:.9;
}

.heart{
  font-size:55px;
  animation:beat 1s infinite;
  margin:15px 0;
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.3)}
}

button{
  margin-top:20px;
  padding:14px 30px;
  border:none;
  border-radius:40px;
  background:linear-gradient(45deg,#ff00ff,#00ffe7);
  color:#000;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,0,255,.9);
}

.confetti{
  position:absolute;
  width:8px;height:8px;
  background:red;
  animation:fall linear infinite;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg)}
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="card">
  <h1>Happy New Year</h1>
  <div class="year">2026</div>
  <div class="heart">❤️</div>
  <p>
    New year = new dreams ✨  
    Smile, success & happiness always with you 💫💕  
    Thank you for being an amazing friend 🤍
  </p>

  <button onclick="playMusic()">🎶 Tap & Celebrate 🎉</button>
</div>

<audio id="music" src="videoplayback.m4a"></audio>

<script>
// stars
for(let i=0;i<120;i++){
  let s=document.createElement("span");
  s.style.left=Math.random()*100+"vw";
  s.style.animationDuration=2+Math.random()*5+"s";
  document.querySelector(".stars").appendChild(s);
}

// music + confetti
function playMusic(){
  document.getElementById("music").play();
  for(let i=0;i<120;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},100%,50%)`;
    c.style.animationDuration=2+Math.random()*3+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}
</script>

</body>
</html>
